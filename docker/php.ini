; Production
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M

; OPcache : le code ne change jamais dans une image, inutile de relire les fichiers.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
